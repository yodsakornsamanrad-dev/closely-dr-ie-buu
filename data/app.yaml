# =====================================================================
#  Closely DR. x IE BUU — ตั้งค่าแอปและขั้นตอน journey
#  ทุกอย่างเป็นข้อมูลสมมติเพื่อ workshop — ไม่ใช่คำแนะนำทางการแพทย์
# =====================================================================

# ขั้นตอนของ Customer Journey (ชื่อ key ห้ามเปลี่ยน แก้ name ได้)
#   sym   : สัญลักษณ์ flow process chart (ASME) op = ปฏิบัติงาน ○, insp = ตรวจสอบ □, delay = รอ D, trans = เคลื่อนย้าย ⇨
#   value : VA = เพิ่มคุณค่า, NNVA = ไม่เพิ่มคุณค่าแต่จำเป็น, NVA = ความสูญเปล่า
#   place : จุดบนแผนที่ (ดู floor-map.yaml → places)
stages:
  - { key: register, name: ลงทะเบียน,            sym: op,    value: NNVA, place: reg }
  - { key: vitals,   name: คัดกรอง วัดความดัน,     sym: insp,  value: NNVA, place: screen }
  - { key: waiting,  name: รอเรียกคิว,            sym: delay, value: NVA,  place: front }
  - { key: consult,  name: พบแพทย์,               sym: op,    value: VA,   place: exam }
  - { key: pharmacy, name: รับยา / ส่งยาถึงบ้าน,   sym: op,    value: VA,   place: pharm }
  - { key: done,     name: กลับบ้าน,              sym: trans, value: NNVA, place: entrance }

walking_speed_mps: 0.7      # ความเร็วเดินผู้สูงอายุ ใช้คำนวณเวลาเดิน
minutes_per_queue: 5        # เวลารอโดยประมาณต่อ 1 คิว
alerts:
  back_at: 10               # แจ้งเตือน "กลับมารอ" เมื่อเหลือคิวก่อนหน้าเท่านี้
  ready_at: 2               # แจ้งเตือน "เตรียมตัว" เมื่อเหลือคิวก่อนหน้าเท่านี้

# ส่งยาถึงบ้าน 5 ขั้น และเวลาที่เหลือโดยประมาณ (นาที) ของแต่ละขั้น
delivery:
  steps: [หมอสั่งยาแล้ว, จัดยาแยกซองตามมื้อ, ไรเดอร์รับยาแล้ว, กำลังนำส่ง, ส่งถึงแล้ว]
  eta_left: [55, 45, 30, 15, 0]
  window_min: [30, 60]
  partner: ไรเดอร์ส่งยา (พาร์ทเนอร์จำลอง)
pharmacy_wait_min: 25       # เวลารอคิวห้องยาโดยประมาณ (ตัวเลือก "รับเองที่ห้องยา")
default_address: 99/12 ถ.ลงหาดบางแสน ต.แสนสุข อ.เมืองชลบุรี จ.ชลบุรี 20130

# คำถามความรู้สึกหลังจบแต่ละขั้น (1–5) ถาม "เหตุผล" เฉพาะคะแนน 3 ลงมา
faces:
  - [😣, แย่มาก]
  - [🙁, ไม่ค่อยดี]
  - [😐, เฉย ๆ]
  - [🙂, ดี]
  - [😀, ดีมาก]
reasons: [รอนาน, หาทางไม่เจอ, ตัวหนังสือเล็ก, ไม่รู้ว่าต้องทำอะไรต่อ, เจ้าหน้าที่ไม่ได้อธิบาย]

# บัญชีเดโมสำหรับหน้าเข้าสู่ระบบ (ชื่อสมมติ)
demo_account:
  first: สมชาย
  full: สมชาย ใจดี
  initials: สจ
  phone: "0812345678"
  phone_masked: 08x-xxx-5678
