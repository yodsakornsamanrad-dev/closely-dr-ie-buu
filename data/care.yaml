# การติดตามหลังกลับบ้าน — หมอเป็นผู้ตัดสินทุกขั้น
# ข้อมูลสมมติทั้งหมด ไม่ใช่คำแนะนำทางการแพทย์

# แบบประเมินอาการที่หมอตั้ง
#   k : ชื่อคำตอบใน usage log, risk : คำตอบที่น่าเป็นห่วง (แจ้งหมอก่อน), text : ตอบเป็นข้อความ (ข้ามได้)
quiz:
  title: อายุรกรรม ความดันโลหิตสูง ทุก 7–10 วัน
  questions:
    - { k: bp,    q: ความดันตัวบนที่วัดได้เมื่อเช้า, hint: ดูตัวเลขบนสุดของเครื่องวัด (mmHg), opts: [ต่ำกว่า 120, 120–139, 140–159, 160 ขึ้นไป, ไม่ได้วัด], risk: [160 ขึ้นไป] }
    - { k: head,  q: ช่วงนี้ปวดหัวบ่อยแค่ไหน, opts: [ไม่ปวดเลย, นาน ๆ ครั้ง, เกือบทุกวัน], risk: [เกือบทุกวัน] }
    - { k: dizzy, q: เวียนหัวตอนลุกยืนไหม, opts: [ไม่เลย, บางครั้ง, บ่อย], risk: [บ่อย] }
    - { k: adh,   q: กินยาครบทุกมื้อไหม, opts: [ครบทุกมื้อ, ลืมบางมื้อ, ไม่ได้กินเลย], risk: [ไม่ได้กินเลย] }
    - { k: note,  q: มีอาการอื่นอยากบอกหมอไหม, hint: ข้ามได้ ถ้าไม่มี, text: true }
  risk_warning: คำตอบบางข้อน่าเป็นห่วง หมอจะได้รับแจ้งก่อน ถ้าปวดหัวรุนแรง ตามัว หรือแขนขาอ่อนแรง โทร 1669 ทันที
  due_days: 7                # หมอจะส่งแบบประเมินภายในกี่วัน
  review_hours: 24           # หมอพิจารณาผลภายในกี่ชั่วโมง

# จำนวนรอบส่งยา (ยา 30 วัน แบ่งส่ง)
rounds: 3
refill_every_days: 10        # ส่งยารอบต่อไปทุกกี่วันหลังวันนี้

# หมอนัดมาตรวจ
followup:
  days_after: 14
  time: "09:00"
  note: อายุรกรรม ห้องตรวจ 3 งดอาหารหลังเที่ยงคืนเพื่อเจาะเลือด
  reminders_days_before: [3, 1]
  reminder_morning: "07:00"

# ชื่อสถานะ (หน้า staff / แอปผู้ป่วย)
phases:
  meds:     { staff: รอรับยารอบแรก,              patient: รอรับยา }
  waitq:    { staff: รอหมอส่งแบบประเมิน,          patient: รอหมอส่งแบบประเมินอาการ }
  assess:   { staff: ผู้ป่วยกำลังตอบแบบประเมิน,      patient: ตอบแบบประเมินอาการ }
  review:   { staff: รอหมอพิจารณา,               patient: หมอกำลังพิจารณาผล }
  followup: { staff: นัดมาตรวจแล้ว,              patient: "มาตรวจตามนัด {date}" }
  refill:   { staff: ส่งยารอบต่อไป,               patient: รับยารอบต่อไปที่บ้าน }

# แชทกับหมอ (ต้นแบบ: หมอตอบอัตโนมัติจากคำในข้อความ)
chat:
  hours: ตอบในเวลาทำการ 08:00–16:00
  greeting: สวัสดีค่ะ ถ้ามีอาการผิดปกติหรือสงสัยเรื่องยา พิมพ์ถามหมอได้เลยนะคะ
  reply_delay_ms: 1600
  replies:
    - { match: ลืม,   reply: ถ้าลืมไม่เกิน 6 ชั่วโมง กินทันทีที่นึกได้ ถ้าใกล้มื้อถัดไปแล้วให้ข้ามไปเลย ห้ามกินเบิ้ลนะคะ }
    - { match: เวียน,  reply: ลุกจากเตียงหรือเก้าอี้ช้า ๆ นั่งพักก่อนยืนนะคะ ถ้าเวียนหัวมากจนจะล้ม ให้มาโรงพยาบาลค่ะ หมอจะดูเพิ่มจากแบบประเมินรอบนี้ }
    - { match: เลื่อน, reply: ได้ค่ะ หมอขอดูคิวก่อน แล้วจะแจ้งวันนัดใหม่ในแอปนะคะ }
  default_reply: หมอได้รับข้อความแล้วค่ะ จะตอบกลับในเวลาทำการนะคะ
  quick: [ลืมกินยา 1 มื้อ ทำอย่างไรดี, กินยาแล้วเวียนหัว, ขอเลื่อนนัด]
  doctor_check_in: วันนี้ความดันเป็นอย่างไรบ้างคะ อย่าลืมวัดตอนเช้าแล้วจดไว้นะคะ
  reschedule_text: "ขอเลื่อนนัดวันที่ {date} ได้ไหม"
