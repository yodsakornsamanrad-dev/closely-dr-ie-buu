# แผนที่ชั้น 1 อาคารผู้ป่วยนอก
# หน่วยพิกัด = หน่วยบนแผนที่ (กว้าง 360 × สูง 304) 1 หน่วย = metres_per_unit เมตร
floor_name: ชั้น 1 อาคารผู้ป่วยนอก
view: { w: 360, h: 304 }
metres_per_unit: 0.15
corridor_y: 135               # แนวกลางทางเดินหลัก ทุกเส้นทางเดินผ่านแนวนี้
corridors:
  - { x: 4,   y: 118, w: 352, h: 34 }
  - { x: 150, y: 118, w: 36,  h: 184 }

# ห้อง / โซน
#   label2d : ข้อความบนแผนที่ 2D (หลายบรรทัด)
#   short   : ป้ายสั้นบนแผนที่ 3D
#   name    : ชื่อเต็มในรายการความหนาแน่น
#   open    : ด้านที่เปิดออกทางเดิน (N = บน, S = ล่าง)
#   desks / counter / kind : ของในห้องบนแผนที่ 3D
rooms:
  - { key: med,    x: 8,   y: 8,   w: 110, h: 102, label2d: [อายุรกรรม, ห้องตรวจ 1–3], short: อายุรกรรม,    name: หน้าห้องตรวจอายุรกรรม,    open: S, desks: 3 }
  - { key: ortho,  x: 124, y: 8,   w: 110, h: 102, label2d: [กระดูกและข้อ],          short: กระดูกและข้อ, name: หน้าห้องตรวจกระดูกและข้อ, open: S, desks: 2 }
  - { key: eye,    x: 240, y: 8,   w: 112, h: 102, label2d: [ตา],                   short: ตา,          name: หน้าห้องตรวจตา,           open: S, desks: 2 }
  - { key: reg,    x: 8,   y: 160, w: 64,  h: 85,  label2d: [ลง, ทะเบียน],           short: ลงทะเบียน,    name: จุดลงทะเบียน,             open: N, counter: true }
  - { key: screen, x: 76,  y: 160, w: 70,  h: 85,  label2d: [คัดกรอง],               short: คัดกรอง,      name: จุดคัดกรอง,               open: N, desks: 2 }
  - { key: pharm,  x: 190, y: 160, w: 72,  h: 85,  label2d: [การเงิน, "& ห้องยา"],    short: ห้องยา,       name: "การเงิน & ห้องยา",        open: N, counter: true }
  - { key: wc,     x: 266, y: 160, w: 40,  h: 85,  label2d: [ห้อง, น้ำ],              short: ห้องน้ำ,       name: ห้องน้ำ,                  open: N, kind: none }
  - { key: cafe,   x: 310, y: 160, w: 42,  h: 85,  label2d: [ร้าน, กาแฟ],             short: กาแฟ,         name: ร้านกาแฟ,                 open: N, kind: cafe }

entrance_label: { text: ทางเข้า-ออก, x: 144, y: 290 }

# จุดที่ผู้ป่วยเดินไปได้
#   pt   : ตำแหน่งบนแผนที่, spur : ทางจากจุดนี้ไปทางเดินหลัก (ถ้าไม่ใส่ = ลากตรงขึ้น/ลงไปที่ corridor_y)
#   mark : จุดสังเกตตอนใกล้ถึง, hl : ห้องที่ไฮไลต์ว่าเป็นปลายทาง
#   {dept} จะถูกแทนด้วยชื่อแผนกของผู้ป่วย, {room} ด้วยห้องตรวจ
places:
  entrance: { name: ทางเข้า-ออก,       short: ทางออก,       pt: [168, 292], spur: [[168, 292], [168, 135]], mark: ประตูกระจกบานใหญ่ ทางลาดรถเข็นอยู่ด้านขวา, hl: entrance }
  reg:      { name: จุดลงทะเบียน,      short: จุดลงทะเบียน, pt: [40, 160],  mark: 'เคาน์เตอร์ยาวสีขาว มีป้าย "ลงทะเบียน"', hl: reg }
  screen:   { name: จุดคัดกรอง,        short: จุดคัดกรอง,   pt: [111, 160], mark: เครื่องวัดความดันสีขาว 3 เครื่องหน้าเคาน์เตอร์, hl: screen }
  front:    { name: "หน้าห้องตรวจ{dept}", short: หน้าห้องตรวจ, at: front, mark: 'เก้าอี้รอสีฟ้าเรียงหน้าห้อง ป้าย "{dept}" อยู่เหนือประตู', hl: dept }
  exam:     { name: "{room} {dept}",    short: "{room}",     at: door,  mark: ประตูมีเลข 3 ตัวใหญ่, hl: dept }
  pharm:    { name: "การเงิน & ห้องยา",  short: ห้องยา,       pt: [226, 160], mark: จอเรียกคิวรับยาอยู่เหนือช่องจ่ายยา, hl: pharm }
  wc:       { name: ห้องน้ำ,            short: ห้องน้ำ,       pt: [286, 160], mark: ห้องน้ำผู้สูงอายุมีราวจับ อยู่ประตูแรก, hl: wc }
  cafe:     { name: ร้านกาแฟ,          short: ร้านกาแฟ,     pt: [331, 160], mark: มีที่นั่ง และมองเห็นจอเรียกคิวได้จากในร้าน, hl: cafe }

# ประตูห้องตรวจ และจุดนั่งรอหน้าห้อง ของแต่ละแผนก
exam_points:
  med:   { door: [63, 110],  front: [63, 128] }
  ortho: { door: [179, 110], front: [179, 128] }
  eye:   { door: [296, 110], front: [296, 128] }

# ---------- ความหนาแน่น ----------
# base_people : จำนวนคนพื้นฐานในแต่ละโซน (ผู้ป่วย walk-in ที่ไม่ได้ใช้แอป) บวกกับผู้ป่วยในระบบที่อยู่จุดนั้นจริง
# base_wait   : เวลารอโดยประมาณ (นาที)
crowd:
  base_people: { reg: 4, screen: 7, med: 9, ortho: 8, eye: 4, pharm: 26, wc: 2, cafe: 11 }
  screen_busy: 12            # จุดคัดกรองตอนผู้ป่วยกำลังคัดกรอง
  base_wait:   { reg: 2, med: 15, ortho: 12, eye: 8, pharm: 25, wc: 0, cafe: 3 }
  screen_wait_per_person: 0.8
  after_you: 14              # จำนวนคนที่มาหลังคุณในห้องรอแผนกของคุณ (ใช้วาดคนบนแผนที่ 3D)
  levels: [น้อย, ปานกลาง, คนเยอะ]
  level_at: [8, 18]          # คนน้อยกว่า 8 = น้อย, น้อยกว่า 18 = ปานกลาง, มากกว่านั้น = คนเยอะ

# ---------- หน้า staff: replay และคอขวด ----------
# ใช้จำลองจำนวนคนตลอดวัน (07:00–16:00) จากรูปแบบเวลามาถึงแบบ 2 ช่วงพีก (เช้า ~09:00 บ่าย ~13:00)
#   b = คนพื้นฐาน, p = ความสูงพีก, lag = ช่วงพีกช้ากว่าเวลามาถึงกี่ชั่วโมง, svc = นาทีต่อคน, sv = จำนวนช่องบริการ
replay:
  zones:
    reg:    { b: 1, p: 12, lag: 0,    svc: 1.5, sv: 2 }
    screen: { b: 1, p: 16, lag: 0.25, svc: 3,   sv: 2 }
    med:    { b: 2, p: 34, lag: 0.75, svc: 8,   sv: 3 }
    ortho:  { b: 1, p: 16, lag: 0.8,  svc: 9,   sv: 2 }
    eye:    { b: 1, p: 10, lag: 0.7,  svc: 7,   sv: 2 }
    pharm:  { b: 1, p: 34, lag: 1.6,  svc: 3.5, sv: 2 }
    wc:     { b: 0, p: 4,  lag: 0.5,  svc: 0,   sv: 1 }
    cafe:   { b: 1, p: 10, lag: 0.6,  svc: 0,   sv: 1 }
  service_zones: [reg, screen, med, ortho, eye, pharm]
  days_back: 7
  open_min: 420              # 07:00
  close_min: 960             # 16:00
  live_home_today: 62        # "กลับบ้านแล้ววันนี้" ในโหมดข้อมูลสด (ผู้ป่วย walk-in) บวกผู้ป่วยในระบบที่กลับแล้ว
bottleneck:
  wait_min: 15               # รอเกินกี่นาทีถือเป็นคอขวด
  tips:
    pharm: เปิดช่องจ่ายยาเพิ่ม 1 ช่อง หรือแนะนำผู้ป่วยให้เลือกส่งยาถึงบ้าน
    med: ดึงแพทย์จากแผนกที่ว่างมาช่วย หรือเปิดห้องตรวจเพิ่ม
    ortho: เลื่อนนัดที่ไม่เร่งด่วนไปช่วงบ่าย
    eye: เปิดห้องตรวจสายตาเพิ่ม
    screen: เปิดโต๊ะคัดกรองเพิ่ม 1 โต๊ะ
    reg: เปิดช่องลงทะเบียนเพิ่ม หรือแนะนำลงทะเบียนในแอป

