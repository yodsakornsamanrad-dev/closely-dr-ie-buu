# ผลวินิจฉัยสำเร็จรูป (หน้า staff เลือกตอน "บันทึกผลตรวจ")
# ข้อมูลสมมติทั้งหมด ไม่ใช่คำแนะนำทางการแพทย์
#   meals : มื้อที่กิน [เช้า, กลางวัน, เย็น, ก่อนนอน] 1 = กิน, 0 = ไม่กิน
#   prn   : true = กินเฉพาะตอนมีอาการ (when = ระยะห่าง)
templates:
  - id: HT
    dept: med
    dx: ความดันโลหิตสูง
    plain: ความดันในเส้นเลือดสูงกว่าปกติ ตอนนี้ยังไม่อันตราย แต่ถ้ากินยาและลดเค็มสม่ำเสมอ จะช่วยลดโอกาสเป็นโรคหัวใจและอัมพาต
    doctor: พญ.ปรียา ศรีสุข
    doctor_initials: ปศ
    meds:
      - { name: แอมโลดิพีน 5 มก., for: ลดความดันโลหิต, meals: [1, 0, 0, 0], amt: 1 เม็ด, when: หลังอาหาร, days: 30 วัน, warn: ลุกจากเตียงหรือเก้าอี้ช้า ๆ เพราะอาจเวียนหัว }
      - { name: ไฮโดรคลอโรไทอะไซด์ 25 มก., for: ขับปัสสาวะ ช่วยลดความดัน, meals: [1, 0, 0, 0], amt: ครึ่งเม็ด, when: หลังอาหาร, days: 30 วัน, warn: อย่ากินตอนเย็นหรือก่อนนอน จะลุกเข้าห้องน้ำบ่อยตอนกลางคืน }
      - { name: พาราเซตามอล 500 มก., for: แก้ปวดหัว, prn: true, meals: [0, 0, 0, 0], amt: 1 เม็ด, when: ห่างกัน 6 ชม., days: เมื่อมีอาการ, warn: ไม่เกิน 8 เม็ดต่อวัน }
    advice:
      - ลดอาหารเค็ม น้ำปลา ผงชูรส และอาหารสำเร็จรูป
      - เดินวันละ 30 นาที ทำได้เท่าที่ไหว
      - วัดความดันที่บ้านตอนเช้า จดไว้ให้หมอดูครั้งหน้า
      - ถ้าปวดหัวมาก ตามัว หรือแขนขาอ่อนแรง ให้มาโรงพยาบาลทันที
  - id: DM
    dept: med
    dx: เบาหวานชนิดที่ 2
    plain: ร่างกายใช้น้ำตาลได้ไม่ดี น้ำตาลในเลือดจึงสูง ต้องคุมอาหารและกินยาสม่ำเสมอ เพื่อป้องกันโรคไต ตา และแผลที่เท้า
    doctor: พญ.ปรียา ศรีสุข
    doctor_initials: ปศ
    meds:
      - { name: เมทฟอร์มิน 500 มก., for: ลดน้ำตาลในเลือด, meals: [1, 0, 1, 0], amt: 1 เม็ด, when: หลังอาหารทันที, days: 30 วัน, warn: ช่วงแรกอาจท้องอืดเล็กน้อย ถ้าใจสั่น เหงื่อออก มือสั่น ให้อมลูกอมทันที }
    advice:
      - ลดของหวาน ข้าวเหนียว น้ำอัดลม
      - ตรวจดูเท้าทุกวัน
      - เดินวันละ 30 นาที
  - id: URI
    dept: med
    dx: ไข้หวัด
    plain: ติดเชื้อไวรัสที่จมูกและคอ ส่วนใหญ่หายเองใน 5–7 วัน ยาช่วยให้สบายขึ้นระหว่างที่ร่างกายฟื้นตัว
    doctor: พญ.ปรียา ศรีสุข
    doctor_initials: ปศ
    meds:
      - { name: พาราเซตามอล 500 มก., for: ลดไข้ แก้ปวด, prn: true, meals: [0, 0, 0, 0], amt: 1 เม็ด, when: ห่างกัน 6 ชม., days: เมื่อมีอาการ, warn: ไม่เกิน 8 เม็ดต่อวัน }
      - { name: คลอร์เฟนิรามีน 4 มก., for: ลดน้ำมูก, meals: [1, 0, 1, 1], amt: 1 เม็ด, when: หลังอาหาร, days: 5 วัน, warn: อาจง่วงนอน ห้ามขับรถ }
    advice:
      - ดื่มน้ำอุ่นมาก ๆ พักผ่อนให้เพียงพอ
      - ใส่หน้ากากอนามัยเมื่ออยู่กับคนอื่น
      - ถ้าไข้เกิน 3 วัน หรือหายใจเหนื่อย ให้มาโรงพยาบาล
  - id: OA
    dept: ortho
    dx: ข้อเข่าเสื่อม
    plain: กระดูกอ่อนที่รองรับข้อเข่าสึกตามอายุ ทำให้ปวดเวลาเดินหรือขึ้นบันได ไม่อันตรายแต่ต้องดูแลเพื่อไม่ให้เสื่อมเร็ว
    doctor: นพ.สมใจ กระดูกดี
    doctor_initials: สก
    meds:
      - { name: พาราเซตามอล 500 มก., for: แก้ปวด, prn: true, meals: [0, 0, 0, 0], amt: 1–2 เม็ด, when: ห่างกัน 6 ชม., days: เมื่อมีอาการ, warn: ไม่เกิน 8 เม็ดต่อวัน }
      - { name: ไดโคลฟีแนค เจล, for: ทาลดปวดเข่า, meals: [1, 0, 1, 0], amt: ทาบาง ๆ, when: หลังอาบน้ำ, days: 14 วัน, warn: ใช้ทาภายนอกเท่านั้น ล้างมือหลังทา }
    advice:
      - หลีกเลี่ยงการนั่งพับเพียบ คุกเข่า
      - ลดน้ำหนักจะช่วยลดปวดเข่า
      - บริหารกล้ามเนื้อต้นขาวันละ 10 นาที
  - id: DRY
    dept: eye
    dx: ภาวะตาแห้ง
    plain: น้ำตาหล่อเลี้ยงตาน้อยกว่าปกติ ทำให้ระคายเคือง แสบตา ตามัวเป็นพัก ๆ พบบ่อยในผู้สูงอายุและคนที่ใช้จอนาน
    doctor: พญ.ดวงใจ ตาใส
    doctor_initials: ดต
    meds:
      - { name: น้ำตาเทียม, for: หยอดตาให้ชุ่มชื้น, meals: [1, 1, 1, 1], amt: 1–2 หยด ทั้งสองตา, when: ตามมื้อ, days: 30 วัน, warn: เปิดขวดแล้วใช้ภายใน 1 เดือน }
    advice:
      - พักสายตาทุก 20 นาที
      - กะพริบตาบ่อย ๆ
      - หลีกเลี่ยงลมหรือแอร์เป่าตรงหน้า
