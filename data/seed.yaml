  - { id: REG, name: จุดลงทะเบียน / Kiosk,    short: ลงทะเบียน, x: 12, y: 30, w: 10, h: 8, color: "#60A5FA", landmark: ป้ายสีฟ้า ตู้ Kiosk 4 ตู้ }
  - { id: VIT, name: จุดคัดกรอง วัดความดัน,   short: คัดกรอง, x: 25, y: 30, w: 11, h: 8, color: "#F472B6", landmark: ป้ายสีชมพู เก้าอี้วัดความดันอัตโนมัติ }
  - { id: PHA, name: การเงิน & ห้องยา,        short: ห้องยา,  x: 40, y: 30, w: 15, h: 8, color: "#34D399", landmark: ป้ายสีเขียว ช่องจ่ายยา 1-4 }
  - { id: RM3, name: ห้องตรวจ 3 อายุรกรรม,    short: ห้อง 3,  x: 6,  y: 4,  w: 13, h: 9, color: "#FBBF24", landmark: ป้ายสีเหลือง หน้าห้องมีจอเรียกคิว }
  - { id: RM5, name: ห้องตรวจ 5 กระดูกและข้อ, short: ห้อง 5,  x: 22, y: 4,  w: 13, h: 9, color: "#FB923C", landmark: ป้ายสีส้ม ข้างลิฟต์ตัว B }
  - { id: RM7, name: ห้องตรวจ 7 ตา,          short: ห้อง 7,  x: 38, y: 4,  w: 12, h: 9, color: "#A78BFA", landmark: ป้ายสีม่วง ตรงข้ามร้านกาแฟ }
  - { id: WC,  name: ห้องน้ำ (มีห้องน้ำผู้สูงอายุ), short: ห้องน้ำ, x: 53, y: 4, w: 6, h: 9, color: "#CBD5E1", landmark: มีราวจับและปุ่มเรียกพยาบาล, public: true }
  - { id: CAF, name: ร้านกาแฟ & ร้านค้า,      short: ร้านกาแฟ, x: 56, y: 30, w: 3, h: 8, color: "#D6A77A", landmark: ติดกับห้องยา, public: true }

# ผลวินิจฉัยสำเร็จรูปให้ "แพทย์" (หน้า staff) เลือกบันทึก — แก้/เพิ่มได้
diagnosisTemplates:
  - id: HT
    dept: MED
    diagnosis: ความดันโลหิตสูง
    explain: ความดันในหลอดเลือดสูงกว่าปกติ (วันนี้วัดได้ 152/96) ถ้าปล่อยไว้นานเสี่ยงโรคหัวใจและหลอดเลือดสมอง แต่ควบคุมได้ด้วยยาและการปรับพฤติกรรม
    medicines:
      - { name: แอมโลดิพีน (Amlodipine) 5 มก., forWhat: ลดความดันโลหิต, dose: 1 เม็ด, times: [morning], meal: after, days: 90, color: "#F6C445", note: กินทุกวันแม้ไม่มีอาการ ห้ามหยุดยาเอง }
    advice: [ลดอาหารเค็ม น้ำปลา ผงชูรส, วัดความดันที่บ้านเช้า-เย็น แล้วจดไว้, เดินเร็ววันละ 30 นาที]
    followUp: นัดตรวจอีกครั้ง 12 ม.ค. 2570 เวลา 09:00 น.
  - id: DM
    dept: MED
    diagnosis: เบาหวานชนิดที่ 2
    explain: ร่างกายใช้น้ำตาลได้ไม่ดี น้ำตาลในเลือดจึงสูง (วันนี้ 168 มก./ดล.) ต้องคุมอาหารและกินยาสม่ำเสมอ เพื่อป้องกันโรคไต ตา และแผลที่เท้า
    medicines:
      - { name: เมทฟอร์มิน (Metformin) 500 มก., forWhat: ลดน้ำตาลในเลือด, dose: 1 เม็ด, times: [morning, evening], meal: after, days: 90, color: "#FFFFFF", note: กินหลังอาหารทันที ช่วงแรกอาจท้องอืดเล็กน้อย }
    advice: [ลดของหวาน ข้าวเหนียว น้ำอัดลม, ตรวจดูเท้าทุกวัน, ถ้าใจสั่น เหงื่อออก มือสั่น ให้อมลูกอมทันที]
    followUp: นัดเจาะเลือดอีก 3 เดือน (งดอาหารหลังเที่ยงคืน)
  - id: OA
    dept: ORT
    diagnosis: ข้อเข่าเสื่อม
    explain: กระดูกอ่อนที่รองรับข้อเข่าสึกตามอายุ ทำให้ปวดเวลาเดินหรือขึ้นบันได ไม่อันตรายแต่ต้องดูแลเพื่อไม่ให้เสื่อมเร็ว
    medicines:
      - { name: พาราเซตามอล (Paracetamol) 500 มก., forWhat: แก้ปวด, dose: 1-2 เม็ด, times: [], asNeeded: true, meal: any, days: 10, color: "#FFFFFF", note: "กินเมื่อปวด ห่างกันอย่างน้อย 6 ชั่วโมง ไม่เกิน 8 เม็ด/วัน" }
      - { name: ไดโคลฟีแนค เจล (Diclofenac gel), forWhat: ทาลดปวดเข่า, dose: ทาบาง ๆ, times: [morning, evening], meal: any, days: 14, color: "#BFDBFE", note: ใช้ทาภายนอกเท่านั้น ล้างมือหลังทา }
    advice: [หลีกเลี่ยงการนั่งพับเพียบ คุกเข่า, ลดน้ำหนักจะช่วยลดปวดเข่า, บริหารกล้ามเนื้อต้นขาวันละ 10 นาที]
    followUp: นัดติดตามอาการ 4 สัปดาห์
  - id: DRY
    dept: EYE
    diagnosis: ภาวะตาแห้ง
    explain: น้ำตาหล่อเลี้ยงตาน้อยกว่าปกติ ทำให้ระคายเคือง แสบตา ตามัวเป็นพัก ๆ พบบ่อยในผู้สูงอายุและคนที่ใช้จอนาน
    medicines:
      - { name: น้ำตาเทียม (Artificial tears), forWhat: หยอดตาให้ชุ่มชื้น, dose: 1-2 หยด ทั้งสองตา, times: [morning, noon, evening, bedtime], meal: any, days: 30, color: "#BAE6FD", note: เปิดขวดแล้วใช้ภายใน 1 เดือน }
    advice: [พักสายตาทุก 20 นาที, กะพริบตาบ่อย ๆ, หลีกเลี่ยงลมหรือแอร์เป่าตรงหน้า]
    followUp: ถ้าไม่ดีขึ้นใน 1 เดือน กลับมาพบแพทย์

