meta:
  app: Closely DR. x IE BUU
  purpose: Design Thinking workshop — Customer Journey Map prototype
  updatedAt: 2026-10-12T08:00:00

settings:
  walkingSpeedMps: 0.7          # ความเร็วเดินของผู้สูงอายุ (เมตร/วินาที) ใช้คำนวณเวลาเดิน
  corridorY: 21                 # แนวทางเดินหลักบนแผนที่ (หน่วย = เมตร)
  map: { width: 60, height: 40, floorName: ชั้น 1 อาคารผู้ป่วยนอก }
  nearQueueAlert: 2             # แจ้งเตือน "ใกล้ถึงคิว" เมื่อเหลือคิวก่อนหน้าไม่เกินเท่านี้
  deliveryPartner: PillPack by Amazon (พาร์ทเนอร์จำลอง)
  deliverySteps:
    - { key: ordered,          label: รับคำสั่งส่งยาแล้ว,          icon: "📋" }
    - { key: packing,          label: จัดยาแยกซองตามมื้อ,          icon: "📦" }
    - { key: shipped,          label: ส่งออกจากคลังยา,            icon: "🚚" }
    - { key: out_for_delivery, label: กำลังนำส่งถึงบ้าน,           icon: "🛵" }
    - { key: delivered,        label: ส่งถึงบ้านแล้ว,              icon: "🏠" }

# ขั้นตอนของ Customer Journey (แก้ชื่อ/คำอธิบายได้ แอปจะเปลี่ยนตามทันที)
# station: DEPT = ห้องตรวจของแผนกที่ผู้ป่วยเลือก
journey:
#   symbol: สัญลักษณ์ flow process chart (ASME) — operation ○, inspection □, delay D, transport ⇨
#   value : VA = เพิ่มคุณค่าให้ผู้ป่วย, NNVA = ไม่เพิ่มคุณค่าแต่จำเป็น, NVA = ความสูญเปล่า (ควรลด)
  - { key: register, label: ลงทะเบียน,         symbol: operation,  value: NNVA, icon: "📝", station: REG,  hint: ลงทะเบียนผ่านแอปหรือที่ตู้ Kiosk }
  - { key: vitals,   label: คัดกรอง วัดความดัน, symbol: inspection, value: NNVA, icon: "💓", station: VIT,  hint: พยาบาลจะวัดความดัน ชั่งน้ำหนัก และถามอาการ }
  - { key: waiting,  label: รอเรียกคิว,         symbol: delay,      value: NVA,  icon: "⏳", station: DEPT, hint: นั่งรอหน้าห้องตรวจ แอปจะแจ้งเตือนเมื่อถึงคิว }
  - { key: consult,  label: พบแพทย์,            symbol: operation,  value: VA,   icon: "👩‍⚕️", station: DEPT, hint: เข้าห้องตรวจ แพทย์จะบันทึกผลลงแอปให้ }
  - { key: pharmacy, label: รับยา / ส่งยาถึงบ้าน, symbol: operation,  value: VA,   icon: "💊", station: PHA,  hint: รับยาเองที่ห้องยา หรือเลือกส่งยาถึงบ้าน }
  - { key: done,     label: กลับบ้าน,           symbol: transport,  value: NNVA, icon: "✅", station: ENT,  hint: เสร็จสิ้นการรักษาวันนี้ }

departments:
  - { id: MED, name: อายุรกรรม (โรคทั่วไป), icon: "🩺", prefix: A, station: RM3, avgMinutes: 8,  hint: "ไข้ ไอ ความดัน เบาหวาน" }
  - { id: ORT, name: กระดูกและข้อ,         icon: "🦴", prefix: B, station: RM5, avgMinutes: 10, hint: "ปวดเข่า ปวดหลัง ข้อเสื่อม" }
  - { id: EYE, name: ตา,                  icon: "👁️", prefix: C, station: RM7, avgMinutes: 6,  hint: "ตามัว ตาแห้ง ตรวจสายตา" }

# nowServing = เลขคิวที่กำลังเรียก, lastIssued = เลขคิวล่าสุดที่ออกไปแล้ว
queues:
  MED: { nowServing: 12, lastIssued: 15 }
  ORT: { nowServing: 4,  lastIssued: 6 }
  EYE: { nowServing: 2,  lastIssued: 3 }

