# สถิติ value stream ย้อนหลัง (ก่อนเริ่ม workshop) — รวมกับข้อมูลจริงจากแอปในหน้า staff
#   n = จำนวนผู้ป่วย, avg / max = นาที, mood = คะแนนความรู้สึกเฉลี่ย 1–5
value_stream_history:
  n: 40
  stages:
    - { key: register, avg: 4,  max: 9,  mood: 3.9, comments: [ไม่ต้องต่อแถวกรอกเอกสาร] }
    - { key: vitals,   avg: 8,  max: 15, mood: 3.6, comments: [] }
    - { key: waiting,  avg: 30, max: 52, mood: 2.3, comments: [รอนาน ไม่รู้จะถึงเมื่อไหร่ เลยไม่กล้าไปเข้าห้องน้ำ, เห็นคิวในแอป เลยไปซื้อกาแฟได้] }
    - { key: consult,  avg: 10, max: 18, mood: 4.4, comments: [ตัวหนังสือเล็ก มองไม่ค่อยเห็น] }
    - { key: pharmacy, avg: 14, max: 41, mood: 2.8, comments: [คิวรับยายาวมาก, ส่งยาถึงบ้าน ไม่ต้องรอ ดีมาก] }
    - { key: done,     avg: 6,  max: 10, mood: 4.1, comments: [] }
